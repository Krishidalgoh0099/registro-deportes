<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deportes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Registro de Deportes</title>
<style>
:root{
  --bg:#f5f6f4;--card:#ffffff;--ink:#1c2420;--mute:#66726b;--line:#e3e7e3;--accent:#1f7a5a;--accent-ink:#ffffff;
  --walk:#2f7fc1;--run:#d6457a;--bike:#8566cc;--swim:#17a2b8;--gym:#e0772f;--fut:#3d9a47;--danger:#c0392b;--field:#f0f2ef;--good:#2f9e63;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121614;--card:#1b211e;--ink:#eaf0ec;--mute:#93a099;--line:#2a332e;--accent:#4cc79b;--accent-ink:#0c1a14;
  --walk:#5aa6e6;--run:#ef7aa1;--bike:#a995e6;--swim:#4fc3d4;--gym:#f09a5a;--fut:#69c274;--danger:#ef7a6c;--field:#242c28;--good:#5fd391;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:84px;padding-top:env(safe-area-inset-top)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.tabs div{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:10px 2px 9px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:20px;line-height:1}
.tabs button.on{color:var(--accent);font-weight:600}
.seg{display:flex;gap:6px;margin:8px 0}
.seg.wrapseg{flex-wrap:wrap}
.seg.wrapseg button{flex:1 0 30%}
.seg button{flex:1;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:10px 4px;border-radius:10px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;max-width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);font-size:16px;font-family:inherit}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;height:44px;line-height:1.2;text-align:left;margin:0}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0;min-width:0;padding:0}
input[type=date]::-webkit-datetime-edit{padding:0}
.dw{position:relative;height:44px;overflow:hidden;border-radius:10px;background:var(--field);border:1px solid var(--line);min-width:0;width:100%}
.dw input[type=date]{position:absolute;left:0;top:0;right:0;bottom:0;width:100%;height:100%;border:0;border-radius:0;background:transparent;padding:0 12px;margin:0;display:block}
.exr{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--field)}
.exr select,.exr input{background:var(--card)}
.exr-top{display:grid;grid-template-columns:1fr 34px;gap:6px;align-items:center}
.exr-top button{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer}
.exr-nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.exr-nums small{display:block;font-size:11px;color:var(--mute);margin-bottom:3px}
.exr-nums input{padding:9px 8px;font-size:15px}
.shead{display:grid;grid-template-columns:24px 1fr 1fr 34px;gap:8px;font-size:11px;color:var(--mute);margin-top:10px}
.srow{display:grid;grid-template-columns:24px 1fr 1fr 34px;gap:8px;align-items:center;margin-top:5px}
.srow .sn{font-size:13px;color:var(--mute);text-align:center}
.srow input{padding:9px 8px;font-size:15px}
.srow button{border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;line-height:1}
.ddwrap{position:relative;margin:8px 0}
.ddbtn{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 14px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.ddbtn .di,.ddlist .di{display:inline-block;width:28px;font-size:20px}
.ddbtn .car{color:var(--mute)}
.ddlist{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;max-height:55vh;overflow:auto;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.ddlist button{display:flex;align-items:center;width:100%;padding:11px 14px;border:0;background:none;color:var(--ink);font-size:16px;text-align:left;cursor:pointer;font-family:inherit;border-bottom:1px solid var(--line)}
.ddlist button:last-child{border-bottom:0}
.ddlist button.on{background:var(--field);font-weight:600;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--field);color:var(--ink);padding:6px 11px;border-radius:16px;font-size:13px;cursor:pointer;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{width:100%;border:0;background:var(--accent);color:var(--accent-ink);padding:13px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:14px;font-family:inherit}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--field);color:var(--ink);font-weight:500;margin-top:8px}
.btn.small{width:auto;padding:8px 12px;font-size:14px;margin:0}
.preview{margin-top:14px;padding:12px;border-radius:12px;background:var(--field);display:flex;justify-content:space-between;align-items:center;gap:10px}
.preview b{font-size:26px}
.preview .t{font-size:12px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--field);border-radius:12px;padding:12px}
.tile b{display:block;font-size:22px}
.tile span{font-size:12px;color:var(--mute)}
.chart{display:flex;align-items:flex-end;gap:3px;height:130px;margin-top:8px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.col .bar{display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.axis{display:flex;gap:3px;margin-top:4px}
.axis span{flex:1;text-align:center;font-size:11px;color:var(--mute);min-width:0;overflow:hidden}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.legend{font-size:12px;color:var(--mute);margin-top:10px;display:flex;gap:12px;flex-wrap:wrap}
.day{font-size:13px;color:var(--mute);margin:16px 2px 6px;text-transform:capitalize;display:flex;justify-content:space-between}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.item .main{flex:1;min-width:0}
.item .tt{font-weight:600}
.item .dd{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.item .kc{text-align:right;flex:none}
.item .kc b{font-size:18px;display:block}
.item .kc small{color:var(--mute);font-size:11px}
.acts{display:flex;gap:14px;margin-top:2px}
.lk{border:0;background:none;color:var(--mute);font-size:12px;cursor:pointer;padding:4px 0 0;text-decoration:underline;font-family:inherit}
.lk.sure{color:var(--danger);font-weight:600}
.ex{display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr 28px;gap:6px;margin-bottom:6px;align-items:center}
.ex input{padding:9px 8px;font-size:15px}
.ex button{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer}
.exh{display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr 28px;gap:6px;font-size:11px;color:var(--mute)}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.warn{font-size:13px;color:var(--danger);margin-top:8px}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.on{opacity:1}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;color:var(--ink)}
.chk input{width:20px;height:20px;margin-top:2px;flex:none}
.hide{display:none}
.prog{margin:10px 0 4px}
.prog .top{display:flex;justify-content:space-between;font-size:13px}
.prog .trk{height:10px;border-radius:6px;background:var(--field);overflow:hidden;margin-top:5px}
.prog .fill{height:100%;border-radius:6px;background:var(--accent)}
.prog .fill.done{background:var(--good)}
.banner{background:color-mix(in srgb,var(--gym) 16%,transparent);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
.wk{display:flex;gap:6px;align-items:flex-end;height:120px;margin-top:10px}
.wk .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.wk .c i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--walk);min-height:2px}
.wk .c small{font-size:10px;color:var(--mute);margin-bottom:2px;white-space:nowrap}
.wkl{display:flex;gap:6px;margin-top:4px}
.wkl span{flex:1;text-align:center;font-size:10px;color:var(--mute);min-width:0;overflow:hidden;white-space:nowrap}
.delta{font-weight:600}
.delta.up{color:var(--good)}.delta.down{color:var(--danger)}
svg text{fill:var(--mute);font-size:10px;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <h1>Registro de Deportes</h1>

<script>

  rugby:{label:"Rugby",icon:"🏉",hue:5,levels:{1:{label:"Touch / recreativo",met:6.3},2:{label:"Entrenamiento",met:7.5},3:{label:"Partido competitivo",met:8.3}}},

  marciales:{label:"Artes marciales",icon:"🥋",hue:240,levels:{1:{label:"Técnica / kata",met:5.3},2:{label:"Entrenamiento",met:8},3:{label:"Combate / sparring",met:10.3}}},
  escalada:{label:"Escalada",icon:"🧗",hue:30,levels:{1:{label:"Suave",met:5},2:{label:"Moderada (pared indoor)",met:5.8},3:{label:"Intensa (roca / boulder)",met:8}}},
  patinaje:{label:"Patinaje",icon:"⛸️",hue:175,dist:true,levels:{1:{label:"Recreativo",met:5.5},2:{label:"Moderado",met:7},3:{label:"Rápido",met:9.8}}},
  remo:{label:"Remo",icon:"🚣",hue:215,levels:{1:{label:"Suave",met:4.8},2:{label:"Moderado",met:7},3:{label:"Intenso",met:8.5}}},
  spinning:{label:"Spinning",icon:"🚲",hue:265,levels:{1:{label:"Suave",met:4.8},2:{label:"Moderado",met:6.8},3:{label:"Intenso",met:8.8}}},

Object.keys(GENERIC).forEach(function(k){var g=GENERIC[k];TYPES[k]={label:g.label,icon:g.icon,color:k==="other"?"hsl(0 0% 58%)":"hsl("+g.hue+" 62% 54%)"};});
TYPE_KEYS=TYPE_KEYS.concat(Object.keys(GENERIC));

var LS_KEY = "registro-deportes-v1";

var MUSCLES = {

var state = {profile:{height:"",net:false,age:"",sex:""},weights:[],goals:{kcal:"",sessions:""},workouts:[],updatedAt:0};
var ui = {tab:"resumen",range:7,type:"walk",gymRows:[blankRow()],confirmDel:null,editId:null};

function blankSet(){return {r:"",k:""};}
function blankRow(){return {m:"",e:"",n:"",sets:[blankSet()]};}
var BW={"Dominadas":1,"Flexiones":0.65,"Fondos en paralelas (pecho)":1,"Fondos en paralelas (tríceps)":1,"Fondos en banco":0.6}; // fracción del peso corporal que se levanta
function setsOf(e){
  if(e.sets)return e.sets;
  if(!(e.r>0))return [];
  var n=Math.max(1,Math.round(e.s||1)),a=[],i;
  for(i=0;i<n;i++)a.push({r:e.r,k:e.k||0,rr:e.rr!=null?e.rr:String(e.r),rk:e.rk!=null?e.rk:String(e.k||"")});

}
function fk(k){return fmt(k,k%1?1:0);}
function setsText(sets){
  if(!sets.length)return "";
  var same=sets.every(function(x){return x.r===sets[0].r&&x.k===sets[0].k;});
  if(same)return sets.length+"×"+sets[0].r+(sets[0].k>0?" @ "+fk(sets[0].k)+" kg":"");
  return sets.map(function(x){return x.r+"×"+(x.k>0?fk(x.k):"0");}).join(" · ")+" (reps×kg)";
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function $(id){return document.getElementById(id);}
function num(v){var n=parseFloat(String(v==null?"":v).trim().replace(",","."));return isFinite(n)?n:NaN;}
function fmt(n,d){return n.toLocaleString("es-CL",{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function pad(n){return (n<10?"0":"")+n;}
function dstr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){return dstr(new Date());}
function parseD(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function mondayOf(s){var d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return d;}
function shortDate(d){return d.toLocaleDateString("es-CL",{day:"numeric",month:"short"}).replace(".","");}
function toast(t){var el=$("toast");el.textContent=t;el.classList.add("on");setTimeout(function(){el.classList.remove("on");},2000);}
function fmtPace(speed){if(!(speed>0))return "—";var m=60/speed,mm=Math.floor(m),ss=Math.round((m-mm)*60);if(ss===60){mm++;ss=0;}return mm+":"+pad(ss)+" min/km";}

/* ---------- Perfil derivado ---------- */
function sortedWeights(){return state.weights.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});}
function currentWeight(){var w=sortedWeights();return w.length?w[w.length-1].kg:NaN;}
function profileOk(){var kg=currentWeight(),h=num(state.profile.height);return kg>=25&&kg<=300&&h>=100&&h<=250;}
function rmrDay(){ // metabolismo basal (Mifflin-St Jeor) o NaN si faltan datos
  var kg=currentWeight(),h=num(state.profile.height),a=num(state.profile.age),s=state.profile.sex;
  if(!(kg>0&&h>0&&a>=10&&a<=100&&(s==="m"||s==="f")))return NaN;
  return 10*kg+6.25*h-5*a+(s==="m"?5:-161);
}
function rhOf(){var r=rmrDay();return isFinite(r)?r/24:currentWeight();} // kcal/hora en reposo (1 MET)
function upsertWeight(date,kg){
  var e=state.weights.filter(function(x){return x.date===date;})[0];
  if(e)e.kg=kg;else state.weights.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),date:date,kg:kg});
}

/* ---------- Cálculo de calorías ---------- */
function ambulMet(kmh,run){
  var v=kmh*1000/60;
  var c=(kmh>8||(run&&kmh>=6.5))?0.2:0.1; // ACSM: caminar 0,1 / correr 0,2 (m/min, terreno plano)
  return (c*v+3.5)/3.5;
}
function bikeMet(kmh){return kmh<16?4:kmh<19.3?6:kmh<22.6?8:kmh<25.8?10:12;}
function kcalCalc(met,rh,min,net){return (net?Math.max(met-1,0):met)*rh*(min/60);}
function kcalOf(w){return kcalCalc(w.met,w.rh||w.kg,w.minutes,state.profile.net);}

/* ---------- Persistencia (solo este dispositivo) ---------- */
function lsRead(){try{var r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function persist(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){toast("No se pudo guardar en el dispositivo");}
}
function normalize(s){
  if(!s||typeof s!=="object")return null;
  var out={profile:{height:"",net:false,age:"",sex:""},weights:[],goals:{kcal:"",sessions:""},workouts:[],updatedAt:+s.updatedAt||0};
  var p=s.profile||{};
  out.profile.height=p.height||"";out.profile.net=!!p.net;out.profile.age=p.age||"";out.profile.sex=(p.sex==="m"||p.sex==="f")?p.sex:"";
  if(s.goals){out.goals.kcal=s.goals.kcal||"";out.goals.sessions=s.goals.sessions||"";}
  if(Array.isArray(s.weights))out.weights=s.weights.filter(function(w){return w&&w.date&&isFinite(w.kg);});
  if(!out.weights.length&&num(p.weight)>=25){out.weights.push({id:"w0",date:today(),kg:num(p.weight)});} // migra versión anterior
  if(Array.isArray(s.workouts))out.workouts=s.workouts.filter(function(w){return w&&w.id&&w.date&&TYPES[w.type]&&isFinite(w.met)&&isFinite(w.kg)&&isFinite(w.minutes);});
  return out;
}

/* ----- Resumen ----- */
function progHtml(label,val,goal,unit){
  var pct=Math.min(100,goal>0?val/goal*100:0),done=val>=goal;
  return '<div class="prog"><div class="top"><span>'+label+'</span><span><b>'+fmt(val)+'</b> / '+fmt(goal)+' '+unit+(done?' ✓':'')+'</span></div><div class="trk"><div class="fill'+(done?" done":"")+'" style="width:'+pct+'%"></div></div></div>';
}
function weekStats(mondayKey){
  var a=parseD(mondayKey),b=new Date(a);b.setDate(b.getDate()+6);
  var s=dstr(a),e=dstr(b),k=0,n=0;
  state.workouts.forEach(function(w){if(w.date>=s&&w.date<=e){k+=kcalOf(w);n++;}});
  return {kcal:k,n:n};
}
function paceWeeks(){
  var cur=mondayOf(today()),out=[],i;
  for(i=5;i>=0;i--){
    var m=new Date(cur);m.setDate(m.getDate()-7*i);
    var s=dstr(m),e=new Date(m);e.setDate(e.getDate()+6);e=dstr(e);
    var km=0,min=0;
    state.workouts.forEach(function(w){
      if(w.type==="walk"&&w.date>=s&&w.date<=e&&w.d&&w.d.km>0&&w.d.src!=="ritmo"){km+=w.d.km;min+=w.minutes;}
    });
    out.push({m:m,km:km,min:min,speed:min>0?km/(min/60):0});
  }
  return out;
}
function deltaHtml(diff,unit,d){
  if(!isFinite(diff))return "";
  var cls=Math.abs(diff)<0.005?"":(diff>0?"up":"down"),sign=diff>0?"+":diff<0?"−":"";
  return '<span class="delta '+cls+'">'+sign+fmt(Math.abs(diff),d)+' '+unit+'</span>';
}
function viewResumen(){

  list.forEach(function(w){var o=perDay[w.date]||(perDay[w.date]={});o[w.type]=(o[w.type]||0)+kcalOf(w);});
  var cols=[],max=0,i,d,k,o;
  for(i=0;i<days;i++){d=new Date(start);d.setDate(start.getDate()+i);k=dstr(d);o=perDay[k]||{};
    var s=0;TYPE_KEYS.forEach(function(t){s+=o[t]||0;});if(s>max)max=s;cols.push({k:k,o:o,s:s,d:d});}
  var wd=["D","L","M","M","J","V","S"];
  var chart='<div class="chart">'+cols.map(function(c){

  }).join("")+'</div><div class="axis">'+cols.map(function(c,idx){

  var byType={};TYPE_KEYS.forEach(function(t){byType[t]={n:0,k:0};});
  list.forEach(function(w){byType[w.type].n++;byType[w.type].k+=kcalOf(w);});
  var legend='<div class="legend">'+TYPE_KEYS.filter(function(t){return byType[t].n>0;}).map(function(t){return '<span><i class="dot" style="background:'+TYPES[t].color+'"></i>'+TYPES[t].label+': '+byType[t].n+' · '+fmt(byType[t].k)+' kcal</span>';}).join("")+'</div>';
  var h="";
  /* meta semanal */
  var gk=num(state.goals.kcal),gs=num(state.goals.sessions);

    var ws=weekStats(dstr(mondayOf(today())));
    h+='<div class="card"><h2>Meta de esta semana</h2>'+(gk>0?progHtml("Calorías",ws.kcal,gk,"kcal"):"")+(gs>0?progHtml("Actividades",ws.n,gs,""):"")+'<div class="note">De lunes a domingo.</div></div>';
  }
  h+='<div class="seg"><button data-range="7" class="'+(days===7?"on":"")+'">Últimos 7 días</button><button data-range="30" class="'+(days===30?"on":"")+'">Últimos 30 días</button></div>';
  if(!state.workouts.length){
    h+='<div class="card empty">Aún no hay registros.<br>Toca <b>Registrar</b> para agregar tu primera actividad.</div>';
    if(!profileOk())h+=needProfile();
    return h;
  }
  h+='<div class="card"><div class="tiles">'
    +'<div class="tile"><b>'+fmt(totK)+'</b><span>kcal gastadas</span></div>'
    +'<div class="tile"><b>'+list.length+'</b><span>actividades</span></div>'
    +'<div class="tile"><b>'+fmt(totM/60,1)+' h</b><span>de actividad</span></div>'
    +'<div class="tile"><b>'+fmt(km,1)+' km</b><span>recorridos</span></div>'
    +'</div><div class="note">Promedio: '+fmt(totK/days)+' kcal/día en el período.</div></div>'
    +'<div class="card"><h2>Calorías por día</h2>'+chart+legend+'</div>';
  /* ritmo de caminata por semana */
  var pw=paceWeeks(),hasPace=pw.some(function(x){return x.km>0;});
  if(hasPace){
    var maxS=0;pw.forEach(function(x){if(x.speed>maxS)maxS=x.speed;});
    var cur=pw[5],prev=pw[4];
    var cmp="";
    if(cur.km>0&&prev.km>0){
      cmp='Esta semana: <b>'+fmt(cur.speed,1)+' km/h</b> ('+fmtPace(cur.speed)+') · <b>'+fmt(cur.km,1)+' km</b><br>Vs. semana pasada: '+deltaHtml(cur.speed-prev.speed,"km/h",1)+' · '+deltaHtml(cur.km-prev.km,"km",1);
    }else if(cur.km>0){
      cmp='Esta semana: <b>'+fmt(cur.speed,1)+' km/h</b> ('+fmtPace(cur.speed)+') · <b>'+fmt(cur.km,1)+' km</b><br><span class="sub">Sin caminatas con distancia la semana pasada para comparar.</span>';
    }else{
      cmp='<span class="sub">Esta semana aún no tienes caminatas con distancia o pasos.</span>';
    }
    h+='<div class="card"><h2>Ritmo de caminata por semana</h2><div style="font-size:14px">'+cmp+'</div>'
      +'<div class="wk">'+pw.map(function(x){return '<div class="c"><small>'+(x.speed>0?fmt(x.speed,1):"")+'</small><i style="height:'+(maxS?x.speed/maxS*85:0)+'%;'+(x.speed>0?"":"visibility:hidden")+'"></i></div>';}).join("")+'</div>'
      +'<div class="wkl">'+pw.map(function(x){return '<span>'+esc(shortDate(x.m))+'</span>';}).join("")+'</div>'

  }
  if(!profileOk())h+=needProfile();
  return h;

    var P=t==="walk"?WALK_PACE:RUN_PACE;
    if(km>0)d.src="distancia";
    else if(steps>0){km=steps*(0.415*cm/100)/1000;d.src="pasos";d.steps=Math.round(steps);}
    else{km=P[pace].v*min/60;d.src="ritmo";}
    if(steps>0&&d.src==="distancia")d.steps=Math.round(steps);
    speed=km/(min/60);
    if(t==="walk"&&(speed>12||speed<1))warn="Velocidad de "+fmt(speed,1)+" km/h: revisa los minutos o la distancia.";
    if(t==="run"&&(speed>25||speed<3))warn="Velocidad de "+fmt(speed,1)+" km/h: revisa los minutos o la distancia.";
    d.km=km;d.speed=speed;met=ambulMet(speed,t==="run");
  }else if(t==="bike"){
    inp.km=$("f-km").value;inp.bint=$("f-bint").value;
    var bk=num(inp.km);
    if(bk>0){var bs=bk/(min/60);d.km=bk;d.speed=bs;d.src="distancia";met=bikeMet(bs);if(bs>60||bs<3)warn="Velocidad de "+fmt(bs,1)+" km/h: revisa los minutos o la distancia.";}
    else{var bi=BIKE_INT[inp.bint];met=bi.met;d.km=bi.v*min/60;d.speed=bi.v;d.src="ritmo";}
  }else if(t==="swim"){
    inp.m=$("f-m").value;inp.sint=$("f-sint").value;
    met=SWIM_INT[inp.sint].met;var sm=num(inp.m);if(sm>0)d.m=Math.round(sm);
  }else if(t==="gym"){
    var kind=$("f-kind").value,it=+$("f-int").value;
    met=GYM_KINDS[kind].met[it];d.kind=kind;d.int=it;
    var ex=[],vol=0,nsets=0;
    ui.gymRows.forEach(function(row){
      var n=String(row.n||"").trim();if(!n)return;
      var bwf=(BW[n]||0)*kg,sets=[];
      row.sets.forEach(function(st){
        var rr=num(st.r),kk=num(st.k);if(!(rr>0))return;
        kk=(isFinite(kk)&&kk>0)?kk:0;
        sets.push({r:rr,k:kk,rr:String(st.r),rk:String(st.k||"")});
        vol+=rr*(kk+bwf);nsets++;
      });
      ex.push({m:row.m||"",n:n.slice(0,40),sets:sets});
    });
    if(ex.length)d.ex=ex;
    if(vol>0){
      d.vol=Math.round(vol);d.nsets=nsets;
      var idx=(vol/min)/kg; d.idx=idx;
      if(kind==="pesas"){
        met=3.5+2.5*Math.max(0,Math.min(1,(idx-0.5)/2));
        d.src="volumen";
      }
      if(idx>5)warn="Volumen muy alto para "+fmt(min)+" min: revisa los kg, las repeticiones o la duración.";
    }
  }else if(GENERIC[t]){
    var G=GENERIC[t],gl=$("f-glv").value;
    met=G.levels[gl].met;d.glv=+gl;inp.glv=gl;
    if(t==="other"){var gn=($("f-gname").value||"").trim().slice(0,30);d.name=gn;inp.name=gn;}
    if(G.dist){inp.km=$("f-gkm").value;var gk=num(inp.km);if(gk>0)d.km=gk;}
  }else{
    var lv=+$("f-fut").value;met=FUT[lv].met;d.lv=lv;
    inp.goals=$("f-goals").value;inp.ast=$("f-ast").value;
    var g=num(inp.goals),a=num(inp.ast);
    if(g>0)d.goals=Math.round(g);if(a>0)d.ast=Math.round(a);
  }
  d.in=inp;
  return {t:t,min:min,met:met,kg:kg,rh:rh,d:d,kcal:kcalCalc(met,rh,min,net),warn:warn};
}

function prefill(w){

  set("f-date",w.date);set("f-min",String(w.minutes).replace(".",","));set("f-note",w.note||"");
  if(w.type==="walk"){set("f-km",i.km);set("f-steps",i.steps);set("f-pace",i.pace);}
  else if(w.type==="run"){set("f-km",i.km);set("f-rpace",i.pace);}
  else if(w.type==="bike"){set("f-km",i.km);set("f-bint",i.bint);}
  else if(w.type==="swim"){set("f-m",i.m);set("f-sint",i.sint);}

}

/* ----- Historial ----- */
function detailOf(w){
  var d=w.d||{},parts=[];
  parts.push(fmt(w.minutes)+" min");
  if(d.km>0)parts.push(fmt(d.km,2)+" km"+(d.src==="ritmo"?" (est.)":""));
  if(d.speed>0&&(w.type==="walk"||w.type==="run"||w.type==="bike"))parts.push(fmt(d.speed,1)+" km/h"+((w.type==="walk"||w.type==="run")&&d.speed>0?" · "+fmtPace(d.speed):""));
  if(w.type==="walk"&&d.steps)parts.push(fmt(d.steps)+" pasos");
  if(w.type==="bike"&&d.src==="ritmo"&&d.in&&BIKE_INT[d.in.bint])parts.push(BIKE_INT[d.in.bint].label.split(" (")[0]);
  if(w.type==="swim"){if(d.m)parts.push(fmt(d.m)+" m");if(d.in&&SWIM_INT[d.in.sint])parts.push(SWIM_INT[d.in.sint].label.split(" (")[0]);}
  if(w.type==="gym")parts.push((GYM_KINDS[d.kind]?GYM_KINDS[d.kind].label.split(" (")[0]:"Gym")+" · "+(d.src==="volumen"?"intensidad según carga":(INTENS[d.int]||"")));
  if(GENERIC[w.type]){var gl=GENERIC[w.type].levels[d.glv];if(gl)parts.push(gl.label.split(" (")[0]);}
  if(w.type==="football"){parts.push(FUT[d.lv]?FUT[d.lv].label:"Partido");if(d.goals)parts.push(d.goals+(d.goals===1?" gol":" goles"));if(d.ast)parts.push(d.ast+(d.ast===1?" asistencia":" asistencias"));}
  return parts.join(" · ");
}

/* ----- Peso ----- */
function weightChart(list){
  var W=320,H=150,pl=10,pr=10,pt=16,pb=20;
  var xs=list.map(function(e){return parseD(e.date).getTime();}),ys=list.map(function(e){return e.kg;});
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  if(y1-y0<1){y0-=0.5;y1+=0.5;}
  var py=(y1-y0)*0.18;y0-=py;y1+=py;
  function X(t){return x1===x0?W/2:pl+(t-x0)/(x1-x0)*(W-pl-pr);}
  function Y(v){return pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);}
  var pts=list.map(function(e,i){return X(xs[i]).toFixed(1)+","+Y(e.kg).toFixed(1);});
  var last=list[list.length-1],first=list[0];
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Evolución del peso">'
    +'<line x1="'+pl+'" y1="'+(H-pb)+'" x2="'+(W-pr)+'" y2="'+(H-pb)+'" stroke="var(--line)"/>'
    +(list.length>1?'<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+pts.join(" ")+'"/>':"")
    +list.map(function(e,i){return '<circle cx="'+X(xs[i]).toFixed(1)+'" cy="'+Y(e.kg).toFixed(1)+'" r="3.5" fill="var(--accent)"/>';}).join("")
    +'<text x="'+(X(xs[list.length-1])>W-50?W-pr:X(xs[list.length-1]))+'" y="'+(Y(last.kg)-8).toFixed(1)+'" text-anchor="'+(X(xs[list.length-1])>W-50?"end":"middle")+'" style="fill:var(--ink);font-weight:600;font-size:11px">'+fmt(last.kg,1)+'</text>'
    +'<text x="'+pl+'" y="'+(H-5)+'">'+esc(shortDate(parseD(first.date)))+'</text>'
    +'<text x="'+(W-pr)+'" y="'+(H-5)+'" text-anchor="end">'+esc(shortDate(parseD(last.date)))+'</text></svg>';
  return svg;
}

  if(t.dataset.addset!==undefined){var rw=ui.gymRows[+t.dataset.addset];var last=rw.sets[rw.sets.length-1]||blankSet();rw.sets.push({r:last.r,k:last.k});$("exrows").innerHTML=gymRowsHtml();updatePreview();return;}
  if(t.dataset.rmset!==undefined){var pr=t.dataset.rmset.split(":");var r2=ui.gymRows[+pr[0]];r2.sets.splice(+pr[1],1);if(!r2.sets.length)r2.sets=[blankSet()];$("exrows").innerHTML=gymRowsHtml();updatePreview();return;}
  if(t.id==="addex"){ui.gymRows.push(blankRow());$("exrows").innerHTML=gymRowsHtml();return;}
  if(t.dataset.rmex!==undefined){ui.gymRows.splice(+t.dataset.rmex,1);if(!ui.gymRows.length)ui.gymRows=[blankRow()];$("exrows").innerHTML=gymRowsHtml();updatePreview();return;}
  if(t.dataset.del){
    if(ui.confirmDel===t.dataset.del){state.workouts=state.workouts.filter(function(w){return w.id!==t.dataset.del;});ui.confirmDel=null;persist();toast("Eliminado");}
    else ui.confirmDel=t.dataset.del;
    render();return;
  }
  if(t.id==="bk"){
    try{
      var blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="registro-deportes-"+today()+".json";
      document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
      toast("Respaldo descargado");
    }catch(err){toast("No se pudo descargar");}
    return;
  }
  if(t.id==="upd"){
    toast("Actualizando…");
    (async function(){
      try{
        if(navigator.serviceWorker){var rs=await navigator.serviceWorker.getRegistrations();for(var i=0;i<rs.length;i++)await rs[i].unregister();}
        if(window.caches){var ks=await caches.keys();for(var j=0;j<ks.length;j++)await caches.delete(ks[j]);}
      }catch(err){}
      location.replace(location.pathname+"?u="+Date.now());
    })();
    return;
  }
  if(t.id==="csv"){
    var txt=csv();
    var ok=function(){toast("CSV copiado");};
    try{navigator.clipboard.writeText(txt).then(ok,function(){toast("No se pudo copiar");});}catch(err){toast("No se pudo copiar");}
  }
});
function refreshInfo(){var n=$("p-info");if(n)n.innerHTML=infoHtml();}
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.dec){var c=el.value.replace(/[^0-9.,]/g,"");if(c!==el.value)el.value=c;}
  if(el.dataset&&el.dataset.set!==undefined){ui.gymRows[+el.dataset.i].sets[+el.dataset.j][el.dataset.set]=el.value;updatePreview();return;}
  if(el.dataset&&el.dataset.ex!==undefined){if(el.tagName==="SELECT")return;ui.gymRows[+el.dataset.i][el.dataset.ex]=el.value;updatePreview();return;}
  if(el.id==="p-w"){var kg=num(el.value);if(kg>=25&&kg<=300&&Math.abs(kg-(currentWeight()||0))>1e-9){upsertWeight(today(),kg);persist();refreshInfo();}return;}
  if(el.id==="p-h"){state.profile.height=el.value;persist();refreshInfo();return;}
  if(el.id==="p-age"){state.profile.age=el.value;persist();refreshInfo();return;}
  if(el.id==="g-k"){state.goals.kcal=el.value;persist();return;}
  if(el.id==="g-s"){state.goals.sessions=el.value;persist();return;}
  if(ui.tab==="registrar")updatePreview();
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.ex!==undefined&&el.tagName==="SELECT"){
    var row=ui.gymRows[+el.dataset.i];
    if(el.dataset.ex==="m"){row.m=el.value;row.e="";row.n="";}
    else{row.e=el.value;row.n=(el.value&&el.value!=="__otro")?el.value:"";}
    $("exrows").innerHTML=gymRowsHtml();updatePreview();return;
  }
  if(el.id==="rs"&&el.files&&el.files[0]){
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var n=normalize(JSON.parse(fr.result));
        if(!n)throw new Error("x");
        state=n;persist();render();toast("Respaldo restaurado ("+n.workouts.length+" actividades)");
      }catch(err){toast("Archivo no válido");}
    };
    fr.readAsText(el.files[0]);return;
  }
  if(el.id==="p-net"){state.profile.net=el.checked;persist();return;}
  if(el.id==="p-sex"){state.profile.sex=el.value;persist();refreshInfo();return;}
  if(ui.tab==="registrar")updatePreview();
});

/* ---------- Inicio ---------- */
var local=normalize(lsRead());
if(local){state=local;persist();}
if(!profileOk()&&!state.workouts.length)ui.tab="perfil";
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
window.__app={state:function(){return state;}};
})();
</script>
